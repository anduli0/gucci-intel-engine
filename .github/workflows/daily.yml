name: daily-intelligence

on:
  schedule:
    # Goal: cycle COMPLETE (site published) before 08:00 KST.
    # GitHub cron is best-effort: 2026-10-31..11-03 it fired 3-4.5h late, and on
    # 2026-11-10 it DROPPED all four night slots (00:07-06:07 KST) — only the
    # 08:07 slot fired (at 08:45), so the site was stale all morning.
    # Defence = density: a slot every 30 min, off the busy :00/:07 marks, from
    # 00:23 KST to 14:53 KST. Any one slot that fires starts the cycle; every
    # other slot is guarded (no-op in ~20s once today's reports are live), and
    # the concurrency group keeps at most one running + one pending run.
    - cron: '23,53 15-23 * * *'  # 00:23-08:53 KST, every 30 min
    - cron: '23,53 0-5 * * *'    # 09:23-14:53 KST, same-day catch-up sweep
  workflow_dispatch:
    inputs:
      force:
        description: 'Force the full pipeline even if today reports already exist'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-run
  cancel-in-progress: false

jobs:
  intelligence:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}  # optional; Instagram brand heat
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}  # optional; Reddit engagement via official API
      REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}  # optional; engagement collector skips YouTube search without it
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4

      # Backup-run guard: only skip the pipeline (republish only) when ALL of
      # today's core reports exist. Checking only the luxury brief let a
      # midnight-crossing run leave index-interpretation/business-review a day
      # behind while the guard reported "done". A manual force=true always runs.
      - name: Check if today's cycle already completed
        id: guard
        run: |
          today=$(date +%F)
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            echo "done=false" >> "$GITHUB_OUTPUT"
            echo "force=true — running full pipeline."
          elif [ -f "data/reports/daily/${today}-luxury-brief.md" ] \
            && [ -f "data/reports/daily/${today}-index-interpretation.md" ] \
            && [ -f "data/reports/daily/${today}-gucci-business-review.md" ]; then
            echo "done=true" >> "$GITHUB_OUTPUT"
            # With a slot every 30 min, skip the republish too once the site
            # repo already serves today (keeps the extra slots ~free).
            site_date=$(curl -sf --max-time 20 "https://raw.githubusercontent.com/anduli0/gucci-intel-site/main/api/summary?cb=$RANDOM" \
              | python3 -c "import json,sys; print(json.load(sys.stdin)['date'])" || echo "unknown")
            if [ "$site_date" = "$today" ]; then
              echo "publish=false" >> "$GITHUB_OUTPUT"
              echo "All reports for ${today} exist and the site already serves ${today} — nothing to do."
            else
              echo "All reports for ${today} already exist (site=${site_date}) — republish only."
            fi
          else
            echo "done=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.guard.outputs.done == 'false'
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Claude Code
        if: steps.guard.outputs.done == 'false'
        run: npm install -g @anthropic-ai/claude-code

      - name: Run daily pipeline
        if: steps.guard.outputs.done == 'false'
        run: bash scripts/cloud-daily.sh

      - name: Export static site (republish path)
        if: steps.guard.outputs.done == 'true' && steps.guard.outputs.publish != 'false'
        run: |
          python app/server.py --port 8790 &
          sleep 3
          EXPORT_OUT="$PWD/site_out" python scripts/export_static.py
          kill %1 2>/dev/null || true

      - name: Commit data state back to this repo
        if: steps.guard.outputs.done == 'false'
        run: |
          git config user.name "gucci-intel-bot"
          git config user.email "minkyu494@gmail.com"
          git add data
          git commit -m "data: $(date +'%F %H:%M') daily cycle" || echo "no changes"
          git pull --rebase origin main || true
          git push || echo "push skipped"

      - name: Publish site to gucci-intel-site (fixed URL)
        if: steps.guard.outputs.publish != 'false'
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git clone --depth 1 "https://x-access-token:${GH_PAT}@github.com/anduli0/gucci-intel-site.git" site_repo
          # Safety: a broken/empty export must never reach --delete. A missing
          # index.html would wipe the live site's root and serve a 404.
          if [ ! -s site_out/index.html ]; then
            echo "ERROR: site_out/index.html missing or empty — aborting publish to protect the live site." >&2
            exit 1
          fi
          # --exclude .github/automation: site repo keeps its own deploy workflow
          # and docs; a bare --delete once wiped pages.yml and killed deploys.
          rsync -a --delete --exclude .git --exclude .github --exclude automation site_out/ site_repo/
          cd site_repo
          git config user.name "gucci-intel-bot"
          git config user.email "minkyu494@gmail.com"
          git add -A
          git commit -m "cloud update $(date +'%F %H:%M')" || echo "no site changes"
          git push
